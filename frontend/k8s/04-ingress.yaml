apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solscavenger-frontend-ingress
  namespace: solana-scavenger
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: solscavenger.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: solscavenger-frontend
                port:
                  number: 80
    - host: www.solscavenger.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: solscavenger-frontend
                port:
                  number: 80

