apiVersion: v1
kind: ConfigMap
metadata:
  name: solscavenger-frontend-config
  namespace: solana-scavenger
  labels:
    app: solscavenger-frontend
    part-of: solana-scavenger
data:
  config.json: |
    {
      "solanaNetwork": "mainnet-beta",
      "solanaRpc": "https://api.mainnet-beta.solana.com",
      "apiBaseUrl": "https://api.solscavenger.app"
    }
