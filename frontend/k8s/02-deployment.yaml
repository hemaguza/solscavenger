apiVersion: apps/v1
kind: Deployment
metadata:
  name: solscavenger-frontend
  namespace: solana-scavenger
  labels:
    app: solscavenger-frontend
    part-of: solana-scavenger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: solscavenger-frontend
  template:
    metadata:
      labels:
        app: solscavenger-frontend
        part-of: solana-scavenger
    spec:
      containers:
        - name: frontend
          image: solscavenger-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config-volume
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config-volume
          configMap:
            name: solscavenger-frontend-config

