apiVersion: v1
kind: Service
metadata:
  name: solscavenger-frontend
  namespace: solana-scavenger
  labels:
    app: solscavenger-frontend
    part-of: solana-scavenger
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30570
      protocol: TCP
      name: http
  selector:
    app: solscavenger-frontend

