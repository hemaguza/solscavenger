quarkus:
  http:
    port: ${HTTP_PORT:8080}
    cors:
      enabled: true
      origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
      headers: "accept, authorization, content-type, x-requested-with, cf-connecting-ip, cf-ipcountry, cache-control"
      methods: "GET, POST, PUT, DELETE, OPTIONS, HEAD"
      access-control-allow-credentials: true

  datasource:
    db-kind: postgresql
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    reactive:
      url: postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}

  hibernate-orm:
    database:
      generation: ${DB_GENERATION:update}
    log:
      sql: ${DB_SQL_LOG:false}

# MicroProfile & SmallRye JWT Configuration
mp:
  jwt:
    verify:
      publickey:
        location: ${JWT_PUBLIC_KEY_LOCATION:NONE}
      issuer: ${JWT_ISSUER:NONE}

smallrye:
  jwt:
    verify:
      relax-issuer-validation: ${JWT_RELAX_ISSUER:true}
    sign:
      key:
        location: ${JWT_PRIVATE_KEY_LOCATION:NONE}

# Solana & Business Logic Configuration
solscavenger:
  solana:
    rpc-url: ${SOLANA_RPC_URL:https://api.mainnet-beta.solana.com}
    rpc-origin: ${SOLANA_RPC_ORIGIN:}
    network: ${SOLANA_NETWORK:mainnet-beta}
    treasury-wallet: ${TREASURY_WALLET:11111111111111111111111111111111}
    fee-percentage: ${FEE_PERCENTAGE:0.025}
  security:
    cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:20}
    nonce-ttl-minutes: ${NONCE_TTL_MINUTES:5}
    rate-limit:
      nonce-per-minute: ${RATE_LIMIT_NONCE:10}
      scan-per-minute: ${RATE_LIMIT_SCAN:5}
      reclaim-per-minute: ${RATE_LIMIT_RECLAIM:5}

# Test Profile
"%test":
  quarkus:
    hibernate-orm:
      enabled: false
    datasource:
      active: false
  solscavenger:
    solana:
      rpc-url: "http://localhost:8899"
      treasury-wallet: "11111111111111111111111111111111"
