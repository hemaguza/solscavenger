apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solscavenger-core-api-ingress
  namespace: solana-scavenger
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  rules:
    - host: api.solscavenger.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: solscavenger-core-api
                port:
                  number: 8080

