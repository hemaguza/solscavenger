apiVersion: v1
kind: Service
metadata:
  name: solscavenger-core-api
  namespace: solana-scavenger
  labels:
    app: solscavenger-core-api
    part-of: solana-scavenger
spec:
  type: NodePort
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30571
      protocol: TCP
      name: http
  selector:
    app: solscavenger-core-api

