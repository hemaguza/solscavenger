apiVersion: v1
kind: Secret
metadata:
  name: solscavenger-core-api-secret
  namespace: solana-scavenger
  labels:
    app: solscavenger-core-api
    part-of: solana-scavenger
type: Opaque
stringData:
  DB_USER: "admin-solscavenger"
  DB_PASSWORD: "REPLACE_WITH_K8S_SECRET_PASSWORD"
  DB_HOST: "192.168.0.118"
  DB_PORT: "5432"
  DB_NAME: "solscavenger"
  TREASURY_WALLET: "REPLACE_WITH_TREASURY_WALLET_PUBLIC_KEY"
  publicKey.pem: |
    # Paste your RSA Public Key here in PEM format
  privateKey.pem: |
    # Paste your RSA Private Key here in PEM format
