apiVersion: apps/v1
kind: Deployment
metadata:
  name: solscavenger-core-api
  namespace: solana-scavenger
  labels:
    app: solscavenger-core-api
    part-of: solana-scavenger
spec:
  replicas: 4
  selector:
    matchLabels:
      app: solscavenger-core-api
  template:
    metadata:
      labels:
        app: solscavenger-core-api
        part-of: solana-scavenger
    spec:
      containers:
        - name: core-api
          image: solscavenger-core-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: QUARKUS_CONFIG_LOCATIONS
              value: "/deployments/config/application.yml"
            - name: JWT_PUBLIC_KEY_LOCATION
              value: "https://auth.neihec.com/neihec-security/oauth2/jwks"
            - name: JWT_ISSUER
              value: "https://auth.neihec.com/neihec-security"
            - name: JWT_PRIVATE_KEY_LOCATION
              value: "/deployments/keys/privateKey.pem"
          envFrom:
            - secretRef:
                name: solscavenger-core-api-secret
          volumeMounts:
            # Mount application.yml from ConfigMap
            - name: config-volume
              mountPath: /deployments/config/application.yml
              subPath: application.yml
              readOnly: true
            # Mount JWT Keys from Secret
            - name: keys-volume
              mountPath: /deployments/keys
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/public/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /api/v1/public/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config-volume
          configMap:
            name: solscavenger-core-api-config
        - name: keys-volume
          secret:
            secretName: solscavenger-core-api-secret
            items:
              - key: publicKey.pem
                path: publicKey.pem
              - key: privateKey.pem
                path: privateKey.pem

