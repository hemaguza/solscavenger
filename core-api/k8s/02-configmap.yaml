apiVersion: v1
kind: ConfigMap
metadata:
  name: solscavenger-core-api-config
  namespace: solana-scavenger
  labels:
    app: solscavenger-core-api
    part-of: solana-scavenger
data:
  application.yml: |
    quarkus:
      http:
        port: 8080
        cors:
          enabled: true
          origins: ${CORS_ORIGINS:https://solscavenger.app,https://www.solscavenger.app,https://admin.neihec.com}
          headers: "accept, authorization, content-type, x-requested-with, cf-connecting-ip, cf-ipcountry"
          methods: "GET, POST, PUT, DELETE, OPTIONS, HEAD"
          access-control-allow-credentials: true

      datasource:
        db-kind: postgresql
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        reactive:
          url: postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      hibernate-orm:
        database:
          generation: ${DB_GENERATION:update}
        log:
          sql: ${DB_SQL_LOG:false}

    # MicroProfile & SmallRye JWT Configuration
    mp:
      jwt:
        verify:
          publickey:
            location: ${JWT_PUBLIC_KEY_LOCATION:https://auth.neihec.com/neihec-security/oauth2/jwks}
          issuer: ${JWT_ISSUER:https://auth.neihec.com/neihec-security}

    smallrye:
      jwt:
        verify:
          relax-issuer-validation: ${JWT_RELAX_ISSUER:true}
        sign:
          key:
            location: ${JWT_PRIVATE_KEY_LOCATION:/deployments/keys/privateKey.pem}

    # Solana & Business Logic Configuration
    solscavenger:
      solana:
        rpc-url: ${SOLANA_RPC_URL:https://api.mainnet-beta.solana.com}
        treasury-wallet: ${TREASURY_WALLET}
        fee-percentage: ${FEE_PERCENTAGE:0.025}
      security:
        cors-origins: ${CORS_ORIGINS:https://solscavenger.app,https://www.solscavenger.app,https://admin.neihec.com}
        jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:20}
        nonce-ttl-minutes: ${NONCE_TTL_MINUTES:5}
        rate-limit:
          nonce-per-minute: ${RATE_LIMIT_NONCE:10}
          scan-per-minute: ${RATE_LIMIT_SCAN:5}
          reclaim-per-minute: ${RATE_LIMIT_RECLAIM:5}

